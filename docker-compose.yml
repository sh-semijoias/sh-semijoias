services:
  postgres:
    image: postgres:17-alpine
    container_name: sh-semijoias-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sh_semijoias_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sh_semijoias_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
