<!-- Container: os breakpoints do dashboard medem a área de conteúdo (sem o menu lateral), não a janela -->
<div class="@container p-4 sm:p-6">
  <div class="mb-4">
    <h2 class="text-xl font-semibold">Dashboard</h2>
    <p class="text-sm text-(--mat-sys-on-surface-variant)">Indicadores de gestão de vendas e estoque</p>
  </div>

  <app-filtros-dashboard class="block mb-3" />

  <div class="grid grid-cols-1 @lg:grid-cols-2 @4xl:grid-cols-4 gap-3 mb-3">
    <app-card-ticket-medio />
    <app-card-margem-bruta />
    <app-card-dias-estoque />
    <app-card-pecas-sem-giro />
  </div>

  <div class="indicadores">
    <app-card-curva-abc class="@2xl:col-span-2" />
    <app-card-produtos-por-classe />
    <app-card-ticket-medio-mensal />
    <app-card-faturamento-clientes class="@2xl:col-span-2" />
  </div>
</div>
