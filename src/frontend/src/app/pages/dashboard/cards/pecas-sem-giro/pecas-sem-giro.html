@let semGiro = dados();

<app-card-kpi
  icone="timer"
  cor="orange"
  titulo="Peças sem giro (+90 dias)"
  ajuda="Peças em estoque cujo produto não vende há mais de 90 dias ou nunca vendeu, com o valor a custo: soma das faixas 91–180 dias, mais de 180 dias e nunca vendido da idade do estoque. Posição atual, não segue o filtro de período."
  [carregando]="idadeEstoque.isLoading()"
  [erro]="!!idadeEstoque.error()">

  <span valor>
    {{ (semGiro?.quantidadeSemGiro ?? 0) | number:'1.0-0':'pt-BR' }} peças
  </span>

  <ng-container rodape>
    <span>
      {{ (semGiro?.valorSemGiro ?? 0) | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
      parados
    </span>
  </ng-container>

</app-card-kpi>
