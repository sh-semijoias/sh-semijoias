<mat-card appearance="outlined" class="h-full">
  <mat-card-content class="flex flex-col gap-3 h-full">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <h3 class="text-base font-semibold">{{ titulo() }}</h3>
        @if (subtitulo()) {
          <p class="text-sm text-(--mat-sys-on-surface-variant)">{{ subtitulo() }}</p>
        }
        @if (naoSegueFiltroPeriodo()) {
          <p class="text-sm text-(--mat-sys-on-surface-variant)">Não segue o filtro de período</p>
        }
      </div>
      @if (etiqueta()) {
        <span class="shrink-0 rounded-md border border-(--mat-sys-outline) px-2 py-0.5 text-xs text-(--mat-sys-on-surface-variant)">
          {{ etiqueta() }}
        </span>
      }
    </div>

    <div class="flex-1 min-h-0">
      @if (carregando()) {
        <div class="flex justify-center py-8"><mat-spinner diameter="32" /></div>
      } @else if (erro()) {
        <p class="text-sm text-(--mat-sys-error)">Não foi possível carregar.</p>
      } @else if (vazio()) {
        <p class="text-sm text-(--mat-sys-on-surface-variant)">Nenhum dado no período.</p>
      } @else {
        <ng-content />
      }
    </div>

    <ng-content select="[rodape]" />
  </mat-card-content>
</mat-card>
