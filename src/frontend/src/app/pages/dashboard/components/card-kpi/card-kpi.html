<mat-card appearance="outlined" class="h-full" [attr.aria-busy]="carregando()">
  <mat-card-content class="py-2!">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-10 h-10 rounded-lg shrink-0" [class]="classesCor().fundo">
        <mat-icon [class]="classesCor().icone">{{ icone() }}</mat-icon>
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1">
          <p class="text-sm text-(--mat-sys-on-surface-variant)">{{ titulo() }}</p>
          @if (ajuda()) {
            <mat-icon class="text-base! w-4! h-4! leading-4! text-gray-400! dark:text-gray-500! cursor-help"
                      [matTooltip]="ajuda()">info</mat-icon>
          }
        </div>
        @if (carregando()) {
          <div>
            <div class="flex items-center h-7">
              <app-skeleton class="h-5 w-28" />
            </div>
            <div class="flex items-center h-4">
              <app-skeleton class="h-3 w-24" />
            </div>
          </div>
        } @else if (erro()) {
          <p class="text-sm text-(--mat-sys-error) my-1">Não foi possível carregar.</p>
        } @else {
          <p class="text-xl font-semibold"><ng-content select="[valor]" /></p>
          <div class="flex flex-wrap items-center gap-1 text-xs text-(--mat-sys-on-surface-variant)">
            <ng-content select="[rodape]" />
          </div>
        }
      </div>
    </div>
  </mat-card-content>
</mat-card>
