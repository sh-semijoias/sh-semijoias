<!-- Larguras intermediárias: período (texto longo) em linha própria, revendedor e categoria lado a lado -->
<div class="grid grid-cols-1 @lg:grid-cols-2 @4xl:grid-cols-3 gap-3">
  <app-seletor-periodo class="@lg:col-span-2 @4xl:col-span-1" [periodo]="periodo()" (periodoChange)="alterarPeriodo($event)" />

  <app-autocomplete-paginado
    label="Revendedor" placeholder="Todos"
    fieldClass="w-full"
    subscriptSizing="dynamic"
    floatLabel="always"
    [control]="revendedorControl"
    [loadFn]="loadRevendedoresFn"
    [displayFn]="displayRevendedor"
    (selecionado)="alterarRevendedor($event.id)"
    (limpo)="alterarRevendedor(null)"
  />

  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic" floatLabel="always">
    <mat-label>Categoria</mat-label>
    <mat-select placeholder="Todas" [value]="idTipoProduto()" (selectionChange)="alterarCategoria($event.value)">
      <mat-option [value]="null">Todas</mat-option>
      @for (categoria of categorias(); track categoria.id) {
        <mat-option [value]="categoria.id">{{ categoria.descricao }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
