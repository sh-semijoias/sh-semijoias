@if (!isLoginRoute()) {
  <div class="absolute inset-0 flex flex-col z-2">
    <mat-toolbar [class.fixed]="isMobile()">
      @if (isMobile()) {
        <button matIconButton (click)="snavOpen.set(!snavOpen())"><mat-icon>menu</mat-icon></button>
      }
      <h1 class="ml-2">SH Semijoias</h1>
      <span class="flex-1"></span>
      <button matIconButton (click)="sair()" aria-label="Sair">
        <mat-icon>logout</mat-icon>
      </button>
      <button matIconButton (click)="toggleDarkMode()">
        <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>

    <mat-sidenav-container
      class="flex-1"
      [style.marginTop.px]="isMobile() ? 56 : 0"
    >
      <mat-sidenav
        [mode]="isMobile() ? 'over' : 'side'"
        [opened]="isMobile() ? snavOpen() : true"
        [fixedInViewport]="isMobile()"
        fixedTopGap="56"
      >
        <mat-nav-list>
          <a mat-list-item routerLink="/usuarios" routerLinkActive="active-link">
            <mat-icon matListItemIcon>person</mat-icon>
            Usuários
          </a>
        </mat-nav-list>
      </mat-sidenav>

      <mat-sidenav-content>
        <router-outlet></router-outlet>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
} @else {
  <router-outlet></router-outlet>
}
